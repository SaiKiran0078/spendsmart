services:
  spendsmart:
    build: .
    container_name: spendsmart
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////code/data/spendsmart.db
    volumes:
      - spendsmart_data:/code/data
    restart: unless-stopped

volumes:
  spendsmart_data:
