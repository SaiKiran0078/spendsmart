  </g>
  <text x="200" y="126" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="800" fill="#f8fafc">Spend<tspan fill="#34d399">Smart</tspan></text>
  <text x="202" y="174" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="500" fill="#cbd5e1">Track every rupee. Spend smarter.</text>
