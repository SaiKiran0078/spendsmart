<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">SpendSmart</title>
  <desc id="desc">Track every rupee. Spend smarter. A personal expense tracker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/><stop offset="100%" stop-color="#16243b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="60" r="150" fill="#34d399" opacity=".08"/>
  <circle cx="1120" cy="280" r="190" fill="#22d3ee" opacity=".06"/>
  <g transform="translate(78 80)">
    <rect width="92" height="92" rx="24" fill="url(#accent)"/>
    <path d="M25 28h42v10H25zm0 18h42v10H25zm0 18h28v10H25z" fill="#071321"/>
    <circle cx="69" cy="69" r="18" fill="#0b1220" stroke="#fff" stroke-width="3"/>
