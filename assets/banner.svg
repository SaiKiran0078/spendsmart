    <text x="24" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#f8fafc">₹10,000</text>
    <rect x="24" y="88" width="202" height="10" rx="5" fill="#26364e"/>
