<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard · SpendSmart</title>
  <meta name="theme-color" content="#0b1220" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/app.css" />
  <script src="js/theme-init.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="index.html"><img src="assets/favicon.svg" alt="" />Spend<span>Smart</span></a>
      <nav class="side-nav" id="side-nav"></nav>
      <div class="side-footer">
        <div class="user-chip">
          <div class="avatar" id="avatar" aria-hidden="true">?</div>
          <div><strong id="user-name">Loading…</strong><small id="user-email"></small></div>
        </div>
        <button class="btn ghost" id="logout-btn" type="button">Log out</button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn ghost icon" id="menu-btn" type="button" aria-label="Open menu"></button>
          <h1 id="page-title">Dashboard</h1>
        </div>
        <div class="topbar-right">
          <div class="month-switch" id="month-switch" role="group" aria-label="Choose month">
            <button type="button" id="month-prev" aria-label="Previous month">‹</button>
            <span id="month-label" aria-live="polite"></span>
            <button type="button" id="month-next" aria-label="Next month">›</button>
          </div>
          <button class="btn ghost icon" id="theme-toggle" type="button" aria-label="Toggle theme"></button>
          <button class="btn primary" id="quick-add" type="button"></button>
        </div>
      </header>
      <main class="page" id="view" tabindex="-1"></main>
    </div>
  </div>
</body>
</html>
